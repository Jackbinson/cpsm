services:
  mongodb:
    image: mongo:latest
    container_name: cspm_mongo
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:alpine
    container_name: cspm_redis
    ports:
      - "6380:6379"

  localstack:
    image: localstack/localstack:2.0.0
    container_name: aws_local_simulator
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3
      DEBUG: 1

  backend:
    build:
      context: .
      dockerfile: dockerfile
    container_name: cspm_backend
    env_file:
      - .env
    ports:
      - "5001:5000"
    depends_on:
      - mongodb
      - redis
      - localstack
    environment: &cspm_environment
      PORT: 5000
      MONGO_URI: mongodb://mongodb:27017/cspm_project
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://127.0.0.1:3001,http://localhost:3001}
      DISCORD_TOKEN: ${DISCORD_TOKEN:-}
      DISCORD_CHANNEL_ID: ${DISCORD_CHANNEL_ID:-}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_ENABLED: ${DISCORD_ENABLED:-false}
      AWS_ENDPOINT: ${AWS_ENDPOINT:-}
      AWS_REGION: ${AWS_REGION:-ap-southeast-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      SCAN_CONCURRENCY: ${SCAN_CONCURRENCY:-2}
      SCAN_TIMEOUT_MS: ${SCAN_TIMEOUT_MS:-600000}
      SCAN_MAX_ATTEMPTS: ${SCAN_MAX_ATTEMPTS:-4}
      SCAN_BACKOFF_MS: ${SCAN_BACKOFF_MS:-5000}
      SCAN_CANCEL_POLL_MS: ${SCAN_CANCEL_POLL_MS:-1000}

  worker:
    build:
      context: .
      dockerfile: dockerfile
    container_name: cspm_worker
    command: npm run worker
    env_file:
      - .env
    depends_on:
      - mongodb
      - redis
      - localstack
    environment:
      <<: *cspm_environment
      DISCORD_ENABLED: "false"
      LOG_SERVICE_NAME: ${WORKER_LOG_SERVICE_NAME:-cpsm-worker}

volumes:
  mongo_data:
